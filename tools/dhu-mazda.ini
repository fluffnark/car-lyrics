# 2021 CX-5 factory-wide display test target: 1280x480, rotary controls.
# Pixel geometry/DPI still need confirmation from the user's actual head unit.
# DHU transports 720p, removing 120 pixels above and below the content.
[general]
inputmode = rotary
touch = false
touchpad = false
controller = true
instrumentcluster = false
resolution = 1280x720
marginheight = 240
marginwidth = 0
cropmargins = true
dpi = 160
realdpi = 133
framerate = 30

[sensors]
location = false
night_mode = true
driving_status = true
